{% load core_extras %}<span class="pill pill-{{ status|lower }}">{% if status == "Fulfilled" %}<i class="bi bi-check-circle-fill" aria-hidden="true"></i>{% elif status == "Expired" %}<i class="bi bi-x-circle" aria-hidden="true"></i>{% elif status == "Rejected" %}<i class="bi bi-slash-circle" aria-hidden="true"></i>{% else %}<i class="bi bi-hourglass-split" aria-hidden="true"></i>{% endif %}{{ status|tr }}</span>
